  // links
  ["guideTop","guideBottom"].forEach(id => document.getElementById(id).setAttribute("href","../?lang="+lang));
  document.querySelectorAll(".li-btn").forEach(a => { if (LINKEDIN_POST_URL){ a.href = LINKEDIN_POST_URL; a.hidden = false; } else { a.hidden = true; } });
  // legend
  document.getElementById("legend").innerHTML = ["good","steady","care","bad"].map(k =>
    '<span class="pill tone-'+k+'">'+SYM[k]+' '+t("leg_"+k)+'</span>').join("");
  // relation cards
  const rels = [["six","good",[6]],["three","good",[3,11]],["none","steady",[2,4,5,8,9]],["ben","care",[7]],["harm","care",[0]],["punish","care",[10]],["clash","bad",[1]]];
  document.getElementById("rels").innerHTML = rels.map(r =>
    '<div class="rel tone-'+r[1]+'"><b>'+SYM[r[1]]+' '+t("rn_"+r[0])+'</b><div class="an">'+r[2].map(animal).join(" · ")+'</div><span class="m">'+t("rm_"+r[0])+'</span></div>').join("");
  // 12-month strip for a Horse (born 1990): same tones the guide shows
  const tones = ["good","steady","steady","steady","care","good","steady","steady","good","steady","bad","care"];
  const starts = [[2027,2,4],[2027,3,6],[2027,4,5],[2027,5,6],[2027,6,6],[2027,7,7],[2027,8,8],[2027,9,8],[2027,10,8],[2027,11,7],[2027,12,7],[2028,1,6]];
  document.getElementById("months").innerHTML = starts.map((s,i) => {
    const d = new Date(Date.UTC(s[0],s[1]-1,s[2]));
    return '<div class="mt tone-'+tones[i]+'"><div class="a">'+fmt(d,{month:"short"})+'</div><div class="c cjk">'+charOf((2+i)%12)+'</div><div class="s">'+SYM[tones[i]]+'</div></div>';
  }).join("");
  // worked example: Horse, Business, 29 Mar - 4 Apr 2027 (pillars and ratings computed with the guide's own rules)
  const days = [["丁未","good"],["戊申","steady"],["己酉","care"],["庚戌","steady"],["辛亥","good"],["壬子","bad"],["癸丑","bad"]];
  document.getElementById("ex").innerHTML = days.map((x,i) => {
    const d = new Date(Date.UTC(2027,2,29+i));
    return '<div class="exr"><div class="dt tone-'+x[1]+'"><div class="w">'+fmt(d,{weekday:"short"})+'</div><div class="n">'+d.getUTCDate()+'</div><div class="p cjk">'+x[0]+'</div><div class="s">'+SYM[x[1]]+'</div></div><div class="t">'+t("ex_d"+(i+1))+'</div></div>';
  }).join("");
}
document.addEventListener("DOMContentLoaded", () => { lang = pickLang(); render(); });
</script>
</body>
</html>
