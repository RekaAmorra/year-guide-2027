<title>2027 Year Guide · 丁未</title>
<meta name="description" content="A simple, free guide to the 2027 Fire Goat year, by Chinese zodiac. Culture and reflection only.">
<meta name="theme-color" content="#b8282f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">

<meta name="mobile-web-app-capable" content="yes">

<style>
:root{
  --ink:#1d2430; --muted:#5d6878; --line:#e3e8ef; --seal:#b8282f;
  --good-bg:#e3f4e8; --good-bd:#b9e1c5; --good-tx:#17653a;
  --steady-bg:#edf1f6; --steady-bd:#d3dce8; --steady-tx:#3d4b5f;
  --care-bg:#fde8ea; --care-bd:#f4c3c8; --care-tx:#9b2d37;
  --bad-bg:#f8cdd2; --bad-bd:#eba0a8; --bad-tx:#7e1f28;
  color-scheme: light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:#fff; color:var(--ink);
  font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue","PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
}
.wrap{max-width:680px; margin:0 auto; padding:0 16px 40px}
.cjk{font-family:"Noto Serif CJK SC","Songti SC",STSong,SimSun,serif}

/* top bar */
.top{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:10px; padding:14px 0 10px}
.brand{display:flex; align-items:center; gap:12px}
.brand h1{margin:0; font-size:1.15rem; line-height:1.2}
.brand p{margin:0; font-size:.82rem; color:var(--muted)}
.tools{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
select,input[type=date]{
  font:inherit; font-size:1rem; color:var(--ink); background:#fff;
  border:1.5px solid #cfd7e2; border-radius:10px; padding:10px 12px; min-height:44px;
}
select:focus-visible,input:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid #8fb4e8; outline-offset:2px}
.btn{
  font:inherit; font-size:.9rem; font-weight:600; min-height:44px; padding:8px 14px; border-radius:10px;
  border:1.5px solid #cfd7e2; background:#fff; color:var(--ink); cursor:pointer;
}
.btn:hover{background:#f6f8fb}
.btn.primary{background:var(--seal); border-color:var(--seal); color:#fff}

/* seal */
.seal{
  display:inline-flex; align-items:center; justify-content:center; flex:none;
  width:76px; height:76px; border-radius:12px; background:var(--seal); color:#fff;
  font-size:2.6rem; font-weight:700; transform:rotate(-3deg); box-shadow:0 0 0 3px #fff, 0 0 0 4.5px var(--seal);
}
.seal.sm{width:42px; height:42px; font-size:1rem; border-radius:8px; transform:none; box-shadow:none; letter-spacing:-1px}

/* cards */
.card{border:1.5px solid var(--line); border-radius:16px; padding:18px; margin-top:16px; background:#fff}
.lead{margin:0 0 14px; font-size:1.02rem}
label.lbl{display:block; font-weight:700; margin-bottom:6px}
#year{width:100%; font-size:1.1rem; font-weight:600}
.note{font-size:.84rem; color:var(--muted); margin:8px 0 0}

/* tones */
.tone-good{background:var(--good-bg); border-color:var(--good-bd); color:var(--good-tx)}
.tone-steady{background:var(--steady-bg); border-color:var(--steady-bd); color:var(--steady-tx)}
.tone-care{background:var(--care-bg); border-color:var(--care-bd); color:var(--care-tx)}
.tone-bad{background:var(--bad-bg); border-color:var(--bad-bd); color:var(--bad-tx)}

/* result */
.res-head{display:flex; gap:16px; align-items:center}
.res-head h2{margin:0; font-size:1.35rem; line-height:1.25}
.res-head p{margin:2px 0 0; color:var(--muted); font-size:.9rem}
.badge{display:inline-block; margin:16px 0 8px; padding:6px 12px; border-radius:999px; font-weight:700; font-size:.92rem; border:1.5px solid}
.sum{margin:0 0 12px}
.dw{display:grid; gap:10px}
@media(min-width:560px){.dw{grid-template-columns:1fr 1fr}}
.dw div{border:1.5px solid var(--line); border-radius:12px; padding:10px 12px; font-size:.95rem}
.dw strong{display:block; font-size:.85rem; color:var(--muted); margin-bottom:2px}
.months-sum{margin-top:14px; display:grid; gap:8px; font-size:.95rem}
.months-sum .row{display:flex; flex-wrap:wrap; gap:6px; align-items:center}
.pill{padding:3px 10px; border-radius:999px; font-size:.85rem; font-weight:700; border:1.5px solid}

/* ribbon */
h3{margin:0 0 4px; font-size:1.05rem}
.ribbon{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:12px}
@media(min-width:560px){.ribbon{grid-template-columns:repeat(6,1fr)}}
.tile{
  font:inherit; cursor:pointer; text-align:center; border:1.5px solid; border-radius:12px;
  padding:8px 4px; min-height:78px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
}
.tile .mo{font-weight:700; font-size:.92rem}
.tile .an{font-size:1.35rem; line-height:1.1}
.tile .sy{font-size:.85rem; font-weight:700}
.tile[aria-pressed=true]{outline:3px solid var(--ink); outline-offset:1px}
.detail{margin-top:12px; padding:12px 14px; border-radius:12px; border:1.5px solid}
.detail b{display:block}
.detail small{display:block; opacity:.85}

/* accordions */
details.card>summary{cursor:pointer; list-style:none; font-weight:700; font-size:1.05rem; display:flex; justify-content:space-between; align-items:center; gap:12px}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:"＋"; font-weight:700; color:var(--seal); font-size:1.2rem}
details.card[open]>summary::after{content:"－"}
details.card>summary small{display:block; font-weight:400; color:var(--muted); font-size:.85rem}
.field{margin-top:16px}
.chips{display:flex; flex-wrap:wrap; gap:8px}
.chip{font:inherit; font-size:.95rem; font-weight:600; min-height:44px; padding:8px 16px; border-radius:999px; border:1.5px solid #cfd7e2; background:#fff; cursor:pointer}
.chip[aria-pressed=true]{background:#1d2430; color:#fff; border-color:#1d2430}
.extras{margin-top:18px; border-top:1.5px solid var(--line); padding-top:14px; display:grid; gap:10px}
.tip{border:1.5px solid var(--line); border-radius:12px; padding:10px 12px; font-size:.95rem}
.tip strong{display:block}
.dirs{display:grid; gap:8px}
.dirrow{display:flex; justify-content:space-between; gap:10px; border:1.5px solid; border-radius:12px; padding:10px 12px; align-items:center}
.dirrow .what{font-size:.82rem; opacity:.9}
.dirrow .dn{font-weight:800; font-size:1.05rem; white-space:nowrap}

/* map */
.compass{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:14px}
.cell{
  font:inherit; cursor:pointer; border:1.5px solid; border-radius:12px; min-height:92px; padding:6px 4px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; position:relative; text-align:center;
}
.cell .dr{font-size:.78rem; font-weight:700; opacity:.85}
.cell .st{font-size:1.7rem; font-weight:800; line-height:1.1}
.cell .sn{font-size:.72rem; line-height:1.2}
.cell .mk{position:absolute; top:4px; right:7px; font-size:.95rem; font-weight:800}
.cell[aria-pressed=true]{outline:3px solid var(--ink); outline-offset:1px}

/* support + care */
.qrs{display:flex; flex-wrap:wrap; gap:18px; justify-content:center; margin-top:14px}
.qr{text-align:center; width:168px}
.qr img,.qr .ph{width:168px; height:168px; border-radius:12px; border:1.5px solid var(--line); object-fit:contain; background:#fff}
.qr .ph{display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:.85rem; border-style:dashed; padding:10px}
.qr figcaption{margin-top:6px; font-weight:700; font-size:.92rem}
.support{text-align:center}
.care ul{margin:8px 0 0; padding-left:20px; display:grid; gap:8px; font-size:.9rem; color:#39434f}
footer{margin-top:22px; text-align:center; color:var(--muted); font-size:.8rem}

dialog{border:1.5px solid var(--line); border-radius:16px; max-width:min(92vw,420px); padding:20px}
dialog::backdrop{background:rgba(29,36,48,.35)}
dialog p{margin:8px 0}
[hidden]{display:none!important}
@media (prefers-reduced-motion:no-preference){ .seal{transition:transform .2s} .res-head .seal{animation:stamp .35s ease-out} }
@keyframes stamp{from{transform:rotate(-3deg) scale(1.25);opacity:0}to{transform:rotate(-3deg) scale(1);opacity:1}}
</style>
</head>

  <header class="top">

  <main>
    <!-- Step 1: the only required input -->
    <section class="card">
      <p class="lead" data-i18n="intro"></p>
      <label class="lbl" for="year" data-i18n="year_label"></label>
      <select id="year"></select>
      <p class="note" data-i18n="year_note"></p>
    </section>

    <!-- Simple read -->
    <section id="result" aria-live="polite"></section>

    <section id="ribbonSec" class="card" hidden>
      <h3 data-i18n="ribbon_title"></h3>
      <p class="note" style="margin-top:0" data-i18n="ribbon_note"></p>
      <div id="ribbon" class="ribbon"></div>
      <div id="monthDetail" class="detail" aria-live="polite"></div>
    </section>

    <!-- Optional layer 1 -->
    <details id="more" class="card">
      <summary><span><span data-i18n="more_title"></span><small data-i18n="more_sub"></small></span></summary>

      <div class="field">
        <label class="lbl" for="dob" data-i18n="dob_label"></label>
        <input type="date" id="dob" min="1930-01-01" max="2026-12-31">
        <p class="note" id="dobNote"></p>
      </div>

      <div class="field">
        <span class="lbl" data-i18n="gender_label"></span>
        <div class="chips" id="genderChips">
          <button type="button" class="chip" data-g="male" aria-pressed="false" data-i18n="g_male"></button>
          <button type="button" class="chip" data-g="female" aria-pressed="false" data-i18n="g_female"></button>
        </div>
        <p class="note" data-i18n="gender_note"></p>
      </div>

      <div class="field">
        <span class="lbl" data-i18n="focus_label"></span>
        <div class="chips" id="focusChips">
          <button type="button" class="chip" data-f="career" aria-pressed="false" data-i18n="f_career"></button>
          <button type="button" class="chip" data-f="money" aria-pressed="false" data-i18n="f_money"></button>
          <button type="button" class="chip" data-f="love" aria-pressed="false" data-i18n="f_love"></button>
          <button type="button" class="chip" data-f="health" aria-pressed="false" data-i18n="f_health"></button>
          <button type="button" class="chip" data-f="family" aria-pressed="false" data-i18n="f_family"></button>
        </div>
      </div>

      <div class="extras" id="extras" aria-live="polite"></div>
    </details>

    <!-- Optional layer 2 -->
    <details id="mapSec" class="card">
      <summary><span><span data-i18n="map_title"></span><small data-i18n="map_sub"></small></span></summary>
      <div class="compass" id="compass"></div>
      <div id="starDetail" class="detail tone-steady" style="margin-top:12px"></div>
      <p class="note" id="mapLegend"></p>
      <p class="note" data-i18n="map_water"></p>
    </details>

    <section class="card support">
      <h3 data-i18n="support_title"></h3>
      <p class="note" style="margin-top:0" data-i18n="support_sub"></p>
      <div class="qrs">
        <figure class="qr" style="margin:0">
          <img src="reka-qr.png" alt="Reka QR" data-ph="reka">
          <figcaption data-i18n="qr_reka"></figcaption>
        </figure>
        <figure class="qr" style="margin:0">
          <img src="wise-qr.png" alt="Wise QR" data-ph="wise">
          <figcaption data-i18n="qr_wise"></figcaption>
        </figure>
      </div>
    </section>

    <section class="card care">
      <h3 data-i18n="care_title"></h3>
      <ul>
        <li data-i18n="c1"></li>
        <li data-i18n="c2"></li>
        <li data-i18n="c3"></li>
        <li data-i18n="c4"></li>
      </ul>
    </section>
  </main>

  <footer data-i18n="footer"></footer>
</div>

<dialog id="installDlg">
  <h3 data-i18n="install_title"></h3>
  <p data-i18n="install_ios"></p>
  <p data-i18n="install_android"></p>
  <button class="btn primary" id="installClose" type="button" data-i18n="close"></button>
</dialog>

  c3:"隐私：所有计算都在你的设备上完成，你的出生资料不会被发送、储存或分享。设计时已参考马来西亚《2010年个人数据保护法》（PDPA）和印尼《2022年第27号个人数据保护法》（UU PDP）。",
  c4:"内容与观点属作者个人，不代表任何机构。",
  footer:"2027年运程指南 · 仅供文化与反思参考"
}
};

/* ============================================================
   DATA (language-independent)
   ============================================================ */
const CN_ANIMALS = ["鼠","牛","虎","兔","龙","蛇","马","羊","猴","鸡","狗","猪"];
// Day of February on which Li Chun (start of the Chinese solar year) falls, 1930-2026 (Beijing/KL time)
const LICHUN = "4554455445544554445444544454445444544454445444544444444444444444444444444444444444444443444344434";
// Month starts of the 2027 (Ding Wei) year, on solar terms. Index 0 = Tiger month (branch 2).
const MONTH_STARTS = [[2027,2,4],[2027,3,6],[2027,4,5],[2027,5,6],[2027,6,6],[2027,7,7],[2027,8,8],[2027,9,8],[2027,10,8],[2027,11,7],[2027,12,7],[2028,1,6]];
const MONTH_END_LAST = [2028,2,3];
const GOAT = 7;

const SIX = new Set(["0-1","2-11","3-10","4-9","5-8","6-7"]);
const HARM = new Set(["0-7","1-6","2-5","3-4","8-11","9-10"]);
const THREE = [[8,0,4],[11,3,7],[2,6,10],[5,9,1]];
const PUNISH = [[2,5,8],[1,10,7],[0,3]];
const TONE_OF = {ben:"care",clash:"bad",punish:"care",harm:"care",six:"good",three:"good",mixed:"steady",none:"steady"};
const SYMBOL = {good:"✓",steady:"–",care:"!",bad:"✕"};

// 2027 annual flying stars by direction (centre = 9)
const STAR_AT = {N:5,NE:3,E:7,SE:8,S:4,SW:6,W:2,NW:1,C:9};
const STAR_TONE = {1:"good",2:"bad",3:"care",4:"good",5:"bad",6:"good",7:"care",8:"good",9:"good"};
const COMPASS_ORDER = ["NW","N","NE","W","C","E","SW","S","SE"];

// Kua directions: [Sheng Qi, Tian Yi, Yan Nian, Jue Ming]
const KUA = {1:["SE","E","S","SW"],2:["NE","W","NW","N"],3:["S","N","SE","W"],4:["N","S","E","NE"],
             6:["W","NE","SW","S"],7:["NW","SW","NE","E"],8:["SW","NW","W","SE"],9:["E","SE","N","NW"]};

/* ============================================================
   LOGIC
   ============================================================ */
const state = {lang:"en", year:null, dob:"", gender:null, focus:new Set(), month:0, star:null};

function t(key, params){
  let s = (I18N[state.lang] && I18N[state.lang][key]);
  if (s === undefined) s = I18N.en[key];
  if (s === undefined) return key;
  if (params) for (const k in params) s = s.split("{"+k+"}").join(params[k]);
  return s;
}
const animalName = i => I18N[state.lang].animals[i] || I18N.en.animals[i];
const branchOf = y => (((y-1900)%12)+12)%12;

function relation(a,b){
  if (a===b) return "ben";
  if (((a-b+12)%12)===6) return "clash";
  const k = a<b ? a+"-"+b : b+"-"+a;
  const good = SIX.has(k) ? "six" : (THREE.some(g=>g.includes(a)&&g.includes(b)) ? "three" : null);
  const bad = PUNISH.some(g=>g.includes(a)&&g.includes(b)) ? "punish" : (HARM.has(k) ? "harm" : null);
  if (good && bad) return "mixed";
  return good || bad || "none";
}

function lichunDay(y){ const c = LICHUN[y-1930]; return c ? parseInt(c,10) : 4; }
// returns {cy, early} from an ISO date string
function chineseYearFromDob(iso){
  const [y,m,d] = iso.split("-").map(Number);
  const early = (m===1) || (m===2 && d<lichunDay(y));
  return {cy: early ? y-1 : y, early};
}
function effectiveYear(){
  if (!state.year) return null;
  if (state.dob) return chineseYearFromDob(state.dob).cy;
  return state.year;
}

function kuaNumber(cy, gender){
  const two = String(cy).slice(-2);
  let sum = parseInt(two[0],10) + parseInt(two[1],10);
  while (sum > 9) sum = Math.floor(sum/10) + (sum%10);
  let k;
  if (cy < 2000) k = gender==="male" ? 10 - sum : sum + 5;
  else           k = gender==="male" ? 9 - sum  : sum + 6;
  while (k > 9) k = Math.floor(k/10) + (k%10);
  if (k === 0) k = 9;
  if (k === 5) k = gender==="male" ? 2 : 8;
  return k;
}

function monthRange(i){
  const s = MONTH_STARTS[i];
  const next = i < 11 ? MONTH_STARTS[i+1] : null;
  const start = new Date(Date.UTC(s[0], s[1]-1, s[2]));
  let end;
  if (next){ end = new Date(Date.UTC(next[0], next[1]-1, next[2]) - 86400000); }
  else end = new Date(Date.UTC(MONTH_END_LAST[0], MONTH_END_LAST[1]-1, MONTH_END_LAST[2]));
  return {start, end};
}
const fmtShort = d => new Intl.DateTimeFormat(I18N[state.lang].locale,{day:"numeric",month:"short",timeZone:"UTC"}).format(d);
const fmtMonth = d => new Intl.DateTimeFormat(I18N[state.lang].locale,{month:"short",timeZone:"UTC"}).format(d);

/* ============================================================
   RENDER
   ============================================================ */
const $ = id => document.getElementById(id);

function applyStatic(){
  document.documentElement.lang = state.lang === "zh" ? "zh-CN" : state.lang;
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
  // year options keep value, relabel
  const sel = $("year"); const cur = sel.value;
  sel.innerHTML = "";
  const ph = document.createElement("option");
  ph.value = ""; ph.textContent = t("year_ph"); sel.appendChild(ph);
  for (let y = 2026; y >= 1930; y--){
    const o = document.createElement("option");
    o.value = y; o.textContent = y + " · " + animalName(branchOf(y));
    sel.appendChild(o);
  }
  sel.value = cur;
  $("mapLegend").textContent = t("map_legend");
  document.querySelectorAll(".qr .ph").forEach(p => p.textContent = t("qr_soon"));
}

function renderResult(){
  const cy = effectiveYear();
  const box = $("result");
  if (!cy){
    box.innerHTML = '<div class="card tone-steady" style="border-style:dashed">'+t("empty")+'</div>';
    $("ribbonSec").hidden = true;
    return;
  }
  const a = branchOf(cy);
  const rel = relation(a, GOAT);
  const tone = TONE_OF[rel];
  const key = (rel==="mixed") ? "none" : rel;
  box.innerHTML =
    '<div class="card">'+
      '<div class="res-head"><span class="seal cjk" aria-hidden="true">'+CN_ANIMALS[a]+'</span>'+
        '<div><h2>'+t("you_are",{animal:animalName(a)})+'</h2><p>'+t("cn_year",{y:cy})+'</p></div></div>'+
      '<span class="badge tone-'+tone+'">'+SYMBOL[tone]+' '+t("r_"+key+"_t")+'</span>'+
      '<p class="sum">'+t("r_"+key+"_s")+'</p>'+
      '<div class="dw"><div><strong>'+t("do_label")+'</strong>'+t("r_"+key+"_d")+'</div>'+
      '<div><strong>'+t("watch_label")+'</strong>'+t("r_"+key+"_w")+'</div></div>'+
      '<div class="months-sum" id="monthsSum"></div>'+
    '</div>';
  renderRibbon(a);
}

function monthTone(a, i){
  const b = (2+i) % 12;
  const rel = relation(a, b);
  return {b, rel, tone: TONE_OF[rel]};
}

function renderRibbon(a){
  $("ribbonSec").hidden = false;
  const rib = $("ribbon");
  rib.innerHTML = "";
  const best = [], careful = [];
  for (let i=0;i<12;i++){
    const m = monthTone(a,i);
    const r = monthRange(i);
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "tile tone-"+m.tone;
    btn.setAttribute("aria-pressed", i===state.month ? "true":"false");
    btn.setAttribute("aria-label", fmtShort(r.start)+" – "+fmtShort(r.end)+", "+t("month_of",{animal:animalName(m.b)})+", "+t("tone_"+m.tone));
    btn.innerHTML = '<span class="mo">'+fmtMonth(r.start)+'</span><span class="an cjk">'+CN_ANIMALS[m.b]+'</span><span class="sy">'+SYMBOL[m.tone]+'</span>';
    btn.addEventListener("click", () => { state.month = i; renderRibbon(a); $("ribbon").children[i].focus(); });
    rib.appendChild(btn);
    if (m.tone==="good") best.push(fmtMonth(r.start));
    if (m.tone==="care" || m.tone==="bad") careful.push({n:fmtMonth(r.start), tone:m.tone});
  }
  // detail
  const m = monthTone(a, state.month), r = monthRange(state.month);
  const d = $("monthDetail");
  d.className = "detail tone-"+m.tone;
  d.innerHTML = '<b>'+fmtShort(r.start)+' – '+fmtShort(r.end)+' · '+t("month_of",{animal:animalName(m.b)})+'</b>'+
                '<small>'+SYMBOL[m.tone]+' '+t("rl_"+m.rel)+'</small>'+t("m_"+m.rel);
  // summary lines under result
  const ms = $("monthsSum");
  if (ms){
    let h = "";
    if (best.length) h += '<div class="row"><b>'+t("best_months")+':</b>'+best.map(n=>'<span class="pill tone-good">✓ '+n+'</span>').join("")+'</div>';
    if (careful.length) h += '<div class="row"><b>'+t("care_months")+':</b>'+careful.map(c=>'<span class="pill tone-'+c.tone+'">'+(c.tone==="bad"?"✕ ":"! ")+c.n+'</span>').join("")+'</div>';
    ms.innerHTML = h;
  }
}

function renderDobNote(){
  const n = $("dobNote");
  if (!state.dob){ n.textContent = ""; return; }
  const r = chineseYearFromDob(state.dob);
  n.textContent = t(r.early ? "dob_early" : "dob_ok", {y:r.cy, animal:animalName(branchOf(r.cy))});
}

function personalDirs(){
  const cy = effectiveYear();
  if (!cy || !state.gender) return null;
  const n = kuaNumber(cy, state.gender);
  return {n, d:KUA[n]};
}

function renderExtras(){
  const cy = effectiveYear();
  const ex = $("extras");
  const wantsKua = !!state.gender, wantsFocus = state.focus.size > 0;
  if (!wantsKua && !wantsFocus){ ex.innerHTML = ""; ex.style.display = "none"; return; }
  ex.style.display = "grid";
  if (!cy){ ex.innerHTML = '<p class="note" style="margin:0">'+t("need_year")+'</p>'; return; }
  let h = "";
  if (wantsKua){
    const p = personalDirs();
    const rows = [["sheng","good"],["tian","good"],["yan","good"],["jue","bad"]];
    h += '<div><h3>'+t("kua_title")+'</h3><p class="note" style="margin:0 0 8px">'+t("kua_sub",{n:p.n})+'</p><div class="dirs">';
    rows.forEach((r,i) => {
      const dn = I18N[state.lang].dirs[p.d[i]];
      h += '<div class="dirrow tone-'+r[1]+'"><div><b>'+t("d_"+r[0])+'</b><div class="what">'+t("d_"+r[0]+"_h")+'</div></div><span class="dn">'+dn+'</span></div>';
    });
    h += '</div></div>';
  }
  if (wantsFocus){
    const a = branchOf(cy);
    const tone = TONE_OF[relation(a, GOAT)];
    const tk = tone==="good" ? "good" : (tone==="steady" ? "steady" : "care");
    h += '<div><h3>'+t("focus_title")+'</h3><div style="display:grid;gap:8px;margin-top:8px">';
    ["career","money","love","health","family"].forEach(f => {
      if (state.focus.has(f)) h += '<div class="tip"><strong>'+t("f_"+f)+'</strong>'+t("f_"+f+"_"+tk)+'</div>';
    });
    h += '</div></div>';
  }
  ex.innerHTML = h;
}

function renderMap(){
  const grid = $("compass");
  grid.innerHTML = "";
  const p = personalDirs();
  COMPASS_ORDER.forEach(dir => {
    const star = STAR_AT[dir], tone = STAR_TONE[star];
    let mark = "";
    if (p && dir !== "C"){
      if (p.d.slice(0,3).includes(dir)) mark = "★";
      else if (p.d[3] === dir) mark = "✕";
    }
    const b = document.createElement("button");
    b.type = "button";
    b.className = "cell tone-"+tone;
    b.setAttribute("aria-pressed", state.star===dir ? "true":"false");
    b.setAttribute("aria-label", (dir==="C" ? I18N[state.lang].ds.C : I18N[state.lang].dirs[dir]) + ": " + t("s"+star+"_n") + (mark ? " "+mark : ""));
    b.innerHTML = (mark ? '<span class="mk">'+mark+'</span>' : '')+
      '<span class="dr">'+I18N[state.lang].ds[dir]+'</span><span class="st">'+star+'</span><span class="sn">'+t("s"+star+"_n").split(" · ")[0]+'</span>';
    b.addEventListener("click", () => { state.star = dir; renderMap(); const k = COMPASS_ORDER.indexOf(dir); $("compass").children[k].focus(); });
    grid.appendChild(b);
  });
  const d = $("starDetail");
  if (!state.star){ d.className = "detail"; d.style.borderStyle = "dashed"; d.textContent = t("map_tap"); return; }
  const star = STAR_AT[state.star];
  d.style.borderStyle = "solid";
  d.className = "detail tone-"+STAR_TONE[star];
  const dn = state.star==="C" ? I18N[state.lang].ds.C : I18N[state.lang].dirs[state.star];
  d.innerHTML = '<b>'+dn+' · '+t("s"+star+"_n")+'</b>'+t("s"+star+"_t");
}

function renderAll(){
  renderResult();
  renderDobNote();
  renderExtras();
  renderMap();
}

/* ============================================================
   EVENTS
   ============================================================ */
function init(){
  // language menu
  const langSel = $("lang");
  Object.keys(I18N).forEach(k => {
    const o = document.createElement("option");
    o.value = k; o.textContent = I18N[k].langName; langSel.appendChild(o);
  });
  let saved = null;
  try { saved = localStorage.getItem("guide2027.lang"); } catch(e){}
  const nav = (navigator.language || "en").toLowerCase();
  state.lang = (saved && I18N[saved]) ? saved : (nav.startsWith("ms") && I18N.ms ? "ms" : (nav.startsWith("zh") && I18N.zh ? "zh" : "en"));
  langSel.value = state.lang;
  langSel.addEventListener("change", () => {
    state.lang = langSel.value;
    try { localStorage.setItem("guide2027.lang", state.lang); } catch(e){}
    applyStatic(); renderAll();
  });

  $("year").addEventListener("change", e => {
    const v = e.target.value ? parseInt(e.target.value,10) : null;
    state.year = v;
    if (state.dob && (!v || parseInt(state.dob.slice(0,4),10) !== v)){ state.dob = ""; $("dob").value = ""; }
    renderAll();
  });
  $("dob").addEventListener("change", e => {
    const v = e.target.value;
    if (v && /^\d{4}-\d{2}-\d{2}$/.test(v)){
      const y = parseInt(v.slice(0,4),10);
      if (y >= 1930 && y <= 2026){
        state.dob = v; state.year = y; $("year").value = String(y);
      }
    } else { state.dob = ""; }
    renderAll();
  });
  $("genderChips").addEventListener("click", e => {
    const b = e.target.closest("button[data-g]"); if (!b) return;
    state.gender = (state.gender === b.dataset.g) ? null : b.dataset.g;
    document.querySelectorAll("#genderChips .chip").forEach(c => c.setAttribute("aria-pressed", c.dataset.g===state.gender ? "true":"false"));
    renderExtras(); renderMap();
  });
  $("focusChips").addEventListener("click", e => {
    const b = e.target.closest("button[data-f]"); if (!b) return;
    const f = b.dataset.f;
    if (state.focus.has(f)) state.focus.delete(f); else state.focus.add(f);
    b.setAttribute("aria-pressed", state.focus.has(f) ? "true":"false");
    renderExtras();
  });

  // default month = current month of the 2027 year if we are inside it
  const now = Date.now();
  for (let i=0;i<12;i++){ const r = monthRange(i); if (now >= r.start.getTime() && now <= r.end.getTime()+86399999){ state.month = i; break; } }

  // QR fallbacks
  document.querySelectorAll(".qr img").forEach(img => {
    img.addEventListener("error", () => {
      const ph = document.createElement("div"); ph.className = "ph"; ph.textContent = t("qr_soon");
      img.replaceWith(ph);
    });
  });

  // install button
  let deferred = null;
  window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferred = e; });
  const standalone = (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || window.navigator.standalone;
  if (standalone) $("installBtn").hidden = true;
  $("installBtn").addEventListener("click", async () => {
    if (deferred){ deferred.prompt(); try { await deferred.userChoice; } catch(e){} deferred = null; return; }
    const dlg = $("installDlg");
    if (dlg.showModal) dlg.showModal(); else alert(t("install_ios") + "\n\n" + t("install_android"));
  });
  $("installClose").addEventListener("click", () => $("installDlg").close());

  applyStatic();
  renderAll();
}
document.addEventListener("DOMContentLoaded", init);
</script>
