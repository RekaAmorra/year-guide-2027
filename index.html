<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>2027 Year Guide · 丁未</title>
<meta name="description" content="A simple, free guide to the 2027 Fire Goat year, by Chinese zodiac. Culture and reflection only.">
<meta name="theme-color" content="#b8282f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="2027 Guide">
<script>(function(){var t="light";try{t=localStorage.getItem("guide2027.theme")||"light"}catch(e){}document.documentElement.setAttribute("data-theme",t==="dark"?"dark":"light");})();</script>
<style>
:root{
  --bg:#ffffff; --ink:#1d2430; --muted:#5d6878; --muted2:#39434f; --line:#e3e8ef;
  --field-bg:#ffffff; --field-bd:#cfd7e2; --hover:#f6f8fb; --seal:#b8282f;
  --good-bg:#e3f4e8; --good-bd:#b9e1c5; --good-tx:#17653a;
  --steady-bg:#edf1f6; --steady-bd:#d3dce8; --steady-tx:#3d4b5f;
  --care-bg:#fde8ea; --care-bd:#f4c3c8; --care-tx:#9b2d37;
  --bad-bg:#f8cdd2; --bad-bd:#eba0a8; --bad-tx:#7e1f28;
  --focus:#8fb4e8;
  color-scheme: light;
}
:root[data-theme="dark"]{
  --bg:#121820; --ink:#e8edf3; --muted:#9aa6b6; --muted2:#b7c2d0; --line:#2a3442;
  --field-bg:#1a222d; --field-bd:#3a4757; --hover:#1c2531; --seal:#c93a41;
  --good-bg:#14301f; --good-bd:#25593a; --good-tx:#92e3b0;
  --steady-bg:#1d2633; --steady-bd:#2f3d51; --steady-tx:#bccadb;
  --care-bg:#3a1d22; --care-bd:#6b303a; --care-tx:#f3a7b0;
  --bad-bg:#4b1f27; --bad-bd:#7f3441; --bad-tx:#ffb5bd;
  --focus:#5f8fd0;
  color-scheme: dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue","PingFang SC","Hiragino Sans","Noto Sans CJK SC","Noto Sans CJK JP","Yu Gothic","Microsoft YaHei",sans-serif;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
}
.wrap{max-width:680px; margin:0 auto; padding:0 16px 40px}
.cjk{font-family:"Noto Serif CJK SC","Noto Serif CJK JP","Songti SC","Hiragino Mincho ProN","Yu Mincho",STSong,SimSun,serif}
a{color:inherit}

.top{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:10px; padding:14px 0 10px}
.brand{display:flex; align-items:center; gap:12px; text-decoration:none}
.brand h1{margin:0; font-size:1.15rem; line-height:1.2}
.brand p{margin:0; font-size:.82rem; color:var(--muted)}
.tools{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
select,input[type=date]{
  font:inherit; font-size:1rem; color:var(--ink); background:var(--field-bg);
  border:1.5px solid var(--field-bd); border-radius:10px; padding:10px 12px; min-height:44px;
}
select:focus-visible,input:focus-visible,button:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid var(--focus); outline-offset:2px}
.btn{
  font:inherit; font-size:.9rem; font-weight:600; min-height:44px; padding:8px 14px; border-radius:10px;
  border:1.5px solid var(--field-bd); background:var(--field-bg); color:var(--ink); cursor:pointer;
  display:inline-flex; align-items:center; justify-content:center; text-decoration:none;
}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--seal); border-color:var(--seal); color:#fff}
.btn.icon{width:44px; padding:0; font-size:1.2rem}

.seal{
  display:inline-flex; align-items:center; justify-content:center; flex:none;
  width:76px; height:76px; border-radius:12px; background:var(--seal); color:#fff;
  font-size:2.6rem; font-weight:700; transform:rotate(-3deg); box-shadow:0 0 0 3px var(--bg), 0 0 0 4.5px var(--seal);
}
.seal.sm{width:42px; height:42px; font-size:1rem; border-radius:8px; transform:none; box-shadow:none; letter-spacing:-1px}

.card{border:1.5px solid var(--line); border-radius:16px; padding:18px; margin-top:16px; background:var(--bg)}
.lead{margin:0 0 14px; font-size:1.02rem}
label.lbl,.lbl{display:block; font-weight:700; margin-bottom:6px}
#year{width:100%; font-size:1.1rem; font-weight:600}
.note{font-size:.84rem; color:var(--muted); margin:8px 0 0}

.tone-good{background:var(--good-bg); border-color:var(--good-bd); color:var(--good-tx)}
.tone-steady{background:var(--steady-bg); border-color:var(--steady-bd); color:var(--steady-tx)}
.tone-care{background:var(--care-bg); border-color:var(--care-bd); color:var(--care-tx)}
.tone-bad{background:var(--bad-bg); border-color:var(--bad-bd); color:var(--bad-tx)}

.res-head{display:flex; gap:16px; align-items:center}
.res-head h2{margin:0; font-size:1.35rem; line-height:1.25}
.res-head p{margin:2px 0 0; color:var(--muted); font-size:.9rem}
.badge{display:inline-block; margin:16px 0 8px; padding:6px 12px; border-radius:999px; font-weight:700; font-size:.92rem; border:1.5px solid}
.sum{margin:0 0 12px}
.dw{display:grid; gap:10px}
@media(min-width:560px){.dw{grid-template-columns:1fr 1fr}}
.dw div{border:1.5px solid var(--line); border-radius:12px; padding:10px 12px; font-size:.95rem}
.dw strong{display:block; font-size:.85rem; color:var(--muted); margin-bottom:2px}
.months-sum{margin-top:14px; display:grid; gap:8px; font-size:.95rem}
.months-sum .row{display:flex; flex-wrap:wrap; gap:6px; align-items:center}
.pill{padding:3px 10px; border-radius:999px; font-size:.85rem; font-weight:700; border:1.5px solid}

h2.pt{margin:0 0 4px; font-size:1.25rem}
h3{margin:0 0 4px; font-size:1.05rem}
.ribbon{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:12px}
@media(min-width:560px){.ribbon{grid-template-columns:repeat(6,1fr)}}
.tile{
  font:inherit; cursor:pointer; text-align:center; border:1.5px solid; border-radius:12px;
  padding:8px 4px; min-height:78px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
}
.tile .mo{font-weight:700; font-size:.92rem}
.tile .an{font-size:1.35rem; line-height:1.1}
.tile .sy{font-size:.85rem; font-weight:700}
.tile[aria-pressed=true]{outline:3px solid var(--ink); outline-offset:1px}
.detail{margin-top:12px; padding:12px 14px; border-radius:12px; border:1.5px solid var(--line)}
.detail b{display:block}
.detail small{display:block; opacity:.85}

details.card>summary{cursor:pointer; list-style:none; font-weight:700; font-size:1.05rem; display:flex; justify-content:space-between; align-items:center; gap:12px}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:"＋"; font-weight:700; color:var(--seal); font-size:1.2rem}
details.card[open]>summary::after{content:"－"}
details.card>summary small{display:block; font-weight:400; color:var(--muted); font-size:.85rem}
.field{margin-top:16px}
.chips{display:flex; flex-wrap:wrap; gap:8px}
.chip{font:inherit; font-size:.95rem; font-weight:600; min-height:44px; padding:8px 16px; border-radius:999px; border:1.5px solid var(--field-bd); background:var(--field-bg); color:var(--ink); cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink); color:var(--bg); border-color:var(--ink)}
.extras{margin-top:18px; border-top:1.5px solid var(--line); padding-top:14px; display:grid; gap:10px}
.tip{border:1.5px solid var(--line); border-radius:12px; padding:10px 12px; font-size:.95rem}
.tip strong{display:block}
.dirs{display:grid; gap:8px}
.dirrow{display:flex; justify-content:space-between; gap:10px; border:1.5px solid; border-radius:12px; padding:10px 12px; align-items:center}
.dirrow .what{font-size:.82rem; opacity:.9}
.dirrow .dn{font-weight:800; font-size:1.05rem; white-space:nowrap}

.compass{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:14px}
.cell{
  font:inherit; cursor:pointer; border:1.5px solid; border-radius:12px; min-height:92px; padding:6px 4px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; position:relative; text-align:center;
}
.cell .dr{font-size:.78rem; font-weight:700; opacity:.85}
.cell .st{font-size:1.7rem; font-weight:800; line-height:1.1}
.cell .sn{font-size:.72rem; line-height:1.2}
.cell .mk{position:absolute; top:4px; right:7px; font-size:.95rem; font-weight:800}
.cell[aria-pressed=true]{outline:3px solid var(--ink); outline-offset:1px}

/* support page */
.support{text-align:center}
.qrs{display:flex; flex-wrap:wrap; gap:22px; justify-content:center; margin-top:16px}
.qr{text-align:center; width:200px; margin:0; display:flex; flex-direction:column; align-items:center; gap:8px}
.qr img,.qr .ph{width:200px; height:200px; border-radius:12px; border:1.5px solid var(--line); object-fit:contain; background:#fff; padding:8px}
.qr .ph{display:flex; align-items:center; justify-content:center; color:#5d6878; font-size:.85rem; border-style:dashed}
.qr figcaption{font-weight:700; font-size:.9rem; line-height:1.35}
.back{margin-top:20px}

.care ul{margin:8px 0 0; padding-left:20px; display:grid; gap:8px; font-size:.9rem; color:var(--muted2)}
footer{margin-top:22px; text-align:center; color:var(--muted); font-size:.8rem}
footer nav{margin-bottom:8px; font-size:.9rem}
footer nav a{color:var(--muted)}

dialog{border:1.5px solid var(--line); border-radius:16px; max-width:min(92vw,420px); padding:20px; background:var(--bg); color:var(--ink)}
dialog::backdrop{background:rgba(10,14,20,.5)}
dialog p{margin:8px 0}
[hidden]{display:none!important}
@media (prefers-reduced-motion:no-preference){ .res-head .seal{animation:stamp .35s ease-out} }
@keyframes stamp{from{transform:rotate(-3deg) scale(1.25);opacity:0}to{transform:rotate(-3deg) scale(1);opacity:1}}

/* week by week */
.wk-nav{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:14px}
.wk-nav b{flex:1; text-align:center; font-size:.98rem}
.days{display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin-top:10px}
.day{
  font:inherit; cursor:pointer; text-align:center; border:1.5px solid; border-radius:10px; padding:6px 1px;
  min-height:88px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; min-width:0;
}
.day .wd{font-size:.7rem; opacity:.85}
.day .dd{font-size:1.1rem; font-weight:800; line-height:1.1}
.day .pl{font-size:.82rem}
.day .sy{font-size:.82rem; font-weight:800}
.day[disabled]{opacity:.4; cursor:default; border-style:dashed; background:transparent; color:var(--muted)}
.day[aria-pressed=true]{outline:3px solid var(--ink); outline-offset:1px}
.catrows{display:grid; gap:6px; margin-top:10px}
.catrow{display:flex; justify-content:space-between; gap:8px; font-size:.92rem; border:1.5px solid; border-radius:10px; padding:6px 10px}
.catrow.sel{outline:2px solid var(--ink); outline-offset:1px}
.detail p{margin:6px 0 0}
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <a class="brand" href="#home">
      <span class="seal sm cjk" aria-hidden="true">丁未</span>
      <div>
        <h1 data-i18n="title">2027 Year Guide</h1>
        <p data-i18n="subtitle"></p>
      </div>
    </a>
    <div class="tools">
      <select id="lang" aria-label="Language"></select>
      <button id="themeBtn" class="btn icon" type="button"><span id="themeIcon" aria-hidden="true">☾</span></button>
      <button id="installBtn" class="btn" type="button" data-i18n="install"></button>
    </div>
  </header>

  <!-- PAGE 1: the guide -->
  <div id="pageMain">
  <main>
    <section class="card">
      <p class="lead" data-i18n="intro"></p>
      <label class="lbl" for="year" data-i18n="year_label"></label>
      <select id="year"></select>
      <p class="note" data-i18n="year_note"></p>
    </section>

    <section id="result" aria-live="polite"></section>

    <section id="ribbonSec" class="card" hidden>
      <h3 data-i18n="ribbon_title"></h3>
      <p class="note" style="margin-top:0" data-i18n="ribbon_note"></p>
      <div id="ribbon" class="ribbon"></div>
      <div id="monthDetail" class="detail" aria-live="polite"></div>
    </section>

    <section id="weekSec" class="card" hidden>
      <h3 data-i18n="week_title"></h3>
      <p class="note" style="margin-top:0" data-i18n="week_sub"></p>
      <div class="chips" id="actChips" style="margin-top:12px">
        <button type="button" class="chip" data-a="biz" aria-pressed="true" data-i18n="a_biz"></button>
        <button type="button" class="chip" data-a="love" aria-pressed="false" data-i18n="a_love"></button>
        <button type="button" class="chip" data-a="move" aria-pressed="false" data-i18n="a_move"></button>
        <button type="button" class="chip" data-a="health" aria-pressed="false" data-i18n="a_health"></button>
      </div>
      <p class="note" id="actHint"></p>
      <div class="wk-nav">
        <button type="button" class="btn icon" id="wkPrev">‹</button>
        <b id="wkLabel"></b>
        <button type="button" class="btn icon" id="wkNext">›</button>
      </div>
      <div class="days" id="days"></div>
      <div class="months-sum" id="bestDays" style="margin-top:12px"></div>
      <div id="dayDetail" class="detail" aria-live="polite"></div>
      <p class="note" data-i18n="week_note"></p>
    </section>

    <details id="more" class="card">
      <summary><span><span data-i18n="more_title"></span><small data-i18n="more_sub"></small></span></summary>

      <div class="field">
        <label class="lbl" for="dob" data-i18n="dob_label"></label>
        <input type="date" id="dob" min="1930-01-01" max="2026-12-31">
        <p class="note" id="dobNote"></p>
      </div>

      <div class="field">
        <span class="lbl" data-i18n="gender_label"></span>
        <div class="chips" id="genderChips">
          <button type="button" class="chip" data-g="male" aria-pressed="false" data-i18n="g_male"></button>
          <button type="button" class="chip" data-g="female" aria-pressed="false" data-i18n="g_female"></button>
        </div>
        <p class="note" data-i18n="gender_note"></p>
      </div>

      <div class="field">
        <span class="lbl" data-i18n="focus_label"></span>
        <div class="chips" id="focusChips">
          <button type="button" class="chip" data-f="career" aria-pressed="false" data-i18n="f_career"></button>
          <button type="button" class="chip" data-f="money" aria-pressed="false" data-i18n="f_money"></button>
          <button type="button" class="chip" data-f="love" aria-pressed="false" data-i18n="f_love"></button>
          <button type="button" class="chip" data-f="health" aria-pressed="false" data-i18n="f_health"></button>
          <button type="button" class="chip" data-f="family" aria-pressed="false" data-i18n="f_family"></button>
        </div>
      </div>

      <div class="extras" id="extras" aria-live="polite"></div>
    </details>

    <details id="mapSec" class="card">
      <summary><span><span data-i18n="map_title"></span><small data-i18n="map_sub"></small></span></summary>
      <div class="compass" id="compass"></div>
      <div id="starDetail" class="detail tone-steady" style="margin-top:12px"></div>
      <p class="note" id="mapLegend"></p>
      <p class="note" data-i18n="map_water"></p>
    </details>

    <section class="card care">
      <h3 data-i18n="care_title"></h3>
      <ul>
        <li data-i18n="c1"></li>
        <li data-i18n="c2"></li>
        <li data-i18n="c3"></li>
        <li data-i18n="c4"></li>
      </ul>
    </section>
  </main>

  <footer>
    <nav><a href="#support" data-i18n="nav_support"></a></nav>
    <p data-i18n="footer"></p>
  </footer>
  </div>

  <!-- PAGE 2: support -->
  <div id="pageSupport" hidden>
    <section class="card support">
      <h2 class="pt" data-i18n="support_title"></h2>
      <p class="note" style="margin-top:0" data-i18n="support_sub"></p>

/* ============================================================
   DATA (language-independent)
   ============================================================ */
const CN_ANIMALS = ["鼠","牛","虎","兔","龙","蛇","马","羊","猴","鸡","狗","猪"];
// Day of February on which Li Chun (start of the Chinese solar year) falls, 1930-2026 (Beijing/KL time)
const LICHUN = "4554455445544554445444544454445444544454445444544444444444444444444444444444444444444443444344434";
// Month starts of the 2027 (Ding Wei) year, on solar terms. Index 0 = Tiger month (branch 2).
const MONTH_STARTS = [[2027,2,4],[2027,3,6],[2027,4,5],[2027,5,6],[2027,6,6],[2027,7,7],[2027,8,8],[2027,9,8],[2027,10,8],[2027,11,7],[2027,12,7],[2028,1,6]];
const MONTH_END_LAST = [2028,2,3];
const GOAT = 7;

const SIX = new Set(["0-1","2-11","3-10","4-9","5-8","6-7"]);
const HARM = new Set(["0-7","1-6","2-5","3-4","8-11","9-10"]);
const THREE = [[8,0,4],[11,3,7],[2,6,10],[5,9,1]];
const PUNISH = [[2,5,8],[1,10,7],[0,3]];
const TONE_OF = {ben:"care",clash:"bad",punish:"care",harm:"care",six:"good",three:"good",mixed:"steady",none:"steady"};
const SYMBOL = {good:"✓",steady:"–",care:"!",bad:"✕"};

// 2027 annual flying stars by direction (centre = 9)
const STAR_AT = {N:5,NE:3,E:7,SE:8,S:4,SW:6,W:2,NW:1,C:9};
const STAR_TONE = {1:"good",2:"bad",3:"care",4:"good",5:"bad",6:"good",7:"care",8:"good",9:"good"};
const COMPASS_ORDER = ["NW","N","NE","W","C","E","SW","S","SE"];

// Kua directions: [Sheng Qi, Tian Yi, Yan Nian, Jue Ming]
const KUA = {1:["SE","E","S","SW"],2:["NE","W","NW","N"],3:["S","N","SE","W"],4:["N","S","E","NE"],
             6:["W","NE","SW","S"],7:["NW","SW","NE","E"],8:["SW","NW","W","SE"],9:["E","SE","N","NW"]};

/* ============================================================
   LOGIC
   ============================================================ */
const state = {lang:"en", year:null, dob:"", gender:null, focus:new Set(), month:0, star:null, act:"biz", week:0, day:null};

function t(key, params){
  let s = (I18N[state.lang] && I18N[state.lang][key]);
  if (s === undefined) s = I18N.en[key];
  if (s === undefined) return key;
  if (params) for (const k in params) s = s.split("{"+k+"}").join(params[k]);
  return s;
}
const animalName = i => I18N[state.lang].animals[i] || I18N.en.animals[i];
const charOf = i => (I18N[state.lang].chars || CN_ANIMALS)[i];
const branchOf = y => (((y-1900)%12)+12)%12;

function relation(a,b){
  if (a===b) return "ben";
  if (((a-b+12)%12)===6) return "clash";
  const k = a<b ? a+"-"+b : b+"-"+a;
  const good = SIX.has(k) ? "six" : (THREE.some(g=>g.includes(a)&&g.includes(b)) ? "three" : null);
  const bad = PUNISH.some(g=>g.includes(a)&&g.includes(b)) ? "punish" : (HARM.has(k) ? "harm" : null);
  if (good && bad) return "mixed";
  return good || bad || "none";
}

function lichunDay(y){ const c = LICHUN[y-1930]; return c ? parseInt(c,10) : 4; }
// returns {cy, early} from an ISO date string
function chineseYearFromDob(iso){
  const [y,m,d] = iso.split("-").map(Number);
  const early = (m===1) || (m===2 && d<lichunDay(y));
  return {cy: early ? y-1 : y, early};
}
function effectiveYear(){
  if (!state.year) return null;
  if (state.dob) return chineseYearFromDob(state.dob).cy;
  return state.year;
}

function kuaNumber(cy, gender){
  const two = String(cy).slice(-2);
  let sum = parseInt(two[0],10) + parseInt(two[1],10);
  while (sum > 9) sum = Math.floor(sum/10) + (sum%10);
  let k;
  if (cy < 2000) k = gender==="male" ? 10 - sum : sum + 5;
  else           k = gender==="male" ? 9 - sum  : sum + 6;
  while (k > 9) k = Math.floor(k/10) + (k%10);
  if (k === 0) k = 9;
  if (k === 5) k = gender==="male" ? 2 : 8;
  return k;
}

function monthRange(i){
  const s = MONTH_STARTS[i];
  const next = i < 11 ? MONTH_STARTS[i+1] : null;
  const start = new Date(Date.UTC(s[0], s[1]-1, s[2]));
  let end;
  if (next){ end = new Date(Date.UTC(next[0], next[1]-1, next[2]) - 86400000); }
  else end = new Date(Date.UTC(MONTH_END_LAST[0], MONTH_END_LAST[1]-1, MONTH_END_LAST[2]));
  return {start, end};
}
const fmtShort = d => new Intl.DateTimeFormat(I18N[state.lang].locale,{day:"numeric",month:"short",timeZone:"UTC"}).format(d);
const fmtMonth = d => new Intl.DateTimeFormat(I18N[state.lang].locale,{month:"short",timeZone:"UTC"}).format(d);

/* ============================================================
   RENDER
   ============================================================ */
const $ = id => document.getElementById(id);

function applyStatic(){
  document.documentElement.lang = state.lang === "zh" ? "zh-CN" : state.lang;
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
  // year options keep value, relabel
  const sel = $("year"); const cur = sel.value;
  sel.innerHTML = "";
  const ph = document.createElement("option");
  ph.value = ""; ph.textContent = t("year_ph"); sel.appendChild(ph);
  for (let y = 2026; y >= 1930; y--){
    const o = document.createElement("option");
    o.value = y; o.textContent = y + " · " + animalName(branchOf(y));
    sel.appendChild(o);
  }
  sel.value = cur;
  $("mapLegend").textContent = t("map_legend");
  $("wkPrev").setAttribute("aria-label", t("week_prev")); $("wkPrev").title = t("week_prev");
  $("wkNext").setAttribute("aria-label", t("week_next")); $("wkNext").title = t("week_next");
  document.querySelectorAll(".qr .ph").forEach(p => p.textContent = t("qr_soon"));
}

function renderResult(){
  const cy = effectiveYear();
  const box = $("result");
  if (!cy){
    box.innerHTML = '<div class="card tone-steady" style="border-style:dashed">'+t("empty")+'</div>';
    $("ribbonSec").hidden = true;
    $("weekSec").hidden = true;
    return;
  }
  const a = branchOf(cy);
  const rel = relation(a, GOAT);
  const tone = TONE_OF[rel];
  const key = (rel==="mixed") ? "none" : rel;
  box.innerHTML =
    '<div class="card">'+
      '<div class="res-head"><span class="seal cjk" aria-hidden="true">'+charOf(a)+'</span>'+
        '<div><h2>'+t("you_are",{animal:animalName(a)})+'</h2><p>'+t("cn_year",{y:cy})+'</p></div></div>'+
      '<span class="badge tone-'+tone+'">'+SYMBOL[tone]+' '+t("r_"+key+"_t")+'</span>'+
      '<p class="sum">'+t("r_"+key+"_s")+'</p>'+
      '<div class="dw"><div><strong>'+t("do_label")+'</strong>'+t("r_"+key+"_d")+'</div>'+
      '<div><strong>'+t("watch_label")+'</strong>'+t("r_"+key+"_w")+'</div></div>'+
      '<div class="months-sum" id="monthsSum"></div>'+
    '</div>';
  renderRibbon(a);
}

function monthTone(a, i){
  const b = (2+i) % 12;
  const rel = relation(a, b);
  return {b, rel, tone: TONE_OF[rel]};
}

function renderRibbon(a){
  $("ribbonSec").hidden = false;
  const rib = $("ribbon");
  rib.innerHTML = "";
  const best = [], careful = [];
  for (let i=0;i<12;i++){
    const m = monthTone(a,i);
    const r = monthRange(i);
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "tile tone-"+m.tone;
    btn.setAttribute("aria-pressed", i===state.month ? "true":"false");
    btn.setAttribute("aria-label", fmtShort(r.start)+" – "+fmtShort(r.end)+", "+t("month_of",{animal:animalName(m.b)})+", "+t("tone_"+m.tone));
    btn.innerHTML = '<span class="mo">'+fmtMonth(r.start)+'</span><span class="an cjk">'+charOf(m.b)+'</span><span class="sy">'+SYMBOL[m.tone]+'</span>';
    btn.addEventListener("click", () => { state.month = i; jumpToMonth(i); renderRibbon(a); $("ribbon").children[i].focus(); });
    rib.appendChild(btn);
    if (m.tone==="good") best.push(fmtMonth(r.start));
    if (m.tone==="care" || m.tone==="bad") careful.push({n:fmtMonth(r.start), tone:m.tone});
  }
  // detail
  const m = monthTone(a, state.month), r = monthRange(state.month);
  const d = $("monthDetail");
  d.className = "detail tone-"+m.tone;
  d.innerHTML = '<b>'+fmtShort(r.start)+' – '+fmtShort(r.end)+' · '+t("month_of",{animal:animalName(m.b)})+'</b>'+
                '<small>'+SYMBOL[m.tone]+' '+t("rl_"+m.rel)+'</small>'+t("m_"+m.rel);
  // summary lines under result
  const ms = $("monthsSum");
  if (ms){
    let h = "";
    if (best.length) h += '<div class="row"><b>'+t("best_months")+':</b>'+best.map(n=>'<span class="pill tone-good">✓ '+n+'</span>').join("")+'</div>';
    if (careful.length) h += '<div class="row"><b>'+t("care_months")+':</b>'+careful.map(c=>'<span class="pill tone-'+c.tone+'">'+(c.tone==="bad"?"✕ ":"! ")+c.n+'</span>').join("")+'</div>';
    ms.innerHTML = h;
  }
  renderWeek(a);
}

function renderDobNote(){
  const n = $("dobNote");
  if (!state.dob){ n.textContent = ""; return; }
  const r = chineseYearFromDob(state.dob);
  n.textContent = t(r.early ? "dob_early" : "dob_ok", {y:r.cy, animal:animalName(branchOf(r.cy))});
}

function personalDirs(){
  const cy = effectiveYear();
  if (!cy || !state.gender) return null;
  const n = kuaNumber(cy, state.gender);
  return {n, d:KUA[n]};
}

function renderExtras(){
  const cy = effectiveYear();
  const ex = $("extras");
  const wantsKua = !!state.gender, wantsFocus = state.focus.size > 0;
  if (!wantsKua && !wantsFocus){ ex.innerHTML = ""; ex.style.display = "none"; return; }
  ex.style.display = "grid";
  if (!cy){ ex.innerHTML = '<p class="note" style="margin:0">'+t("need_year")+'</p>'; return; }
  let h = "";
  if (wantsKua){
    const p = personalDirs();
    const rows = [["sheng","good"],["tian","good"],["yan","good"],["jue","bad"]];
    h += '<div><h3>'+t("kua_title")+'</h3><p class="note" style="margin:0 0 8px">'+t("kua_sub",{n:p.n})+'</p><div class="dirs">';
    rows.forEach((r,i) => {
      const dn = I18N[state.lang].dirs[p.d[i]];
      h += '<div class="dirrow tone-'+r[1]+'"><div><b>'+t("d_"+r[0])+'</b><div class="what">'+t("d_"+r[0]+"_h")+'</div></div><span class="dn">'+dn+'</span></div>';
    });
    h += '</div></div>';
  }
  if (wantsFocus){
    const a = branchOf(cy);
    const tone = TONE_OF[relation(a, GOAT)];
    const tk = tone==="good" ? "good" : (tone==="steady" ? "steady" : "care");
    h += '<div><h3>'+t("focus_title")+'</h3><div style="display:grid;gap:8px;margin-top:8px">';
    ["career","money","love","health","family"].forEach(f => {
      if (state.focus.has(f)) h += '<div class="tip"><strong>'+t("f_"+f)+'</strong>'+t("f_"+f+"_"+tk)+'</div>';
    });
    h += '</div></div>';
  }
  ex.innerHTML = h;
}

function renderMap(){
  const grid = $("compass");
  grid.innerHTML = "";
  const p = personalDirs();
  COMPASS_ORDER.forEach(dir => {
    const star = STAR_AT[dir], tone = STAR_TONE[star];
    let mark = "";
    if (p && dir !== "C"){
      if (p.d.slice(0,3).includes(dir)) mark = "★";
      else if (p.d[3] === dir) mark = "✕";
    }
    const b = document.createElement("button");
    b.type = "button";
    b.className = "cell tone-"+tone;
    b.setAttribute("aria-pressed", state.star===dir ? "true":"false");
    b.setAttribute("aria-label", (dir==="C" ? I18N[state.lang].ds.C : I18N[state.lang].dirs[dir]) + ": " + t("s"+star+"_n") + (mark ? " "+mark : ""));
    b.innerHTML = (mark ? '<span class="mk">'+mark+'</span>' : '')+
      '<span class="dr">'+I18N[state.lang].ds[dir]+'</span><span class="st">'+star+'</span><span class="sn">'+t("s"+star+"_n").split(" · ")[0]+'</span>';
    b.addEventListener("click", () => { state.star = dir; renderMap(); const k = COMPASS_ORDER.indexOf(dir); $("compass").children[k].focus(); });
    grid.appendChild(b);
  });
  const d = $("starDetail");
  if (!state.star){ d.className = "detail"; d.style.borderStyle = "dashed"; d.textContent = t("map_tap"); return; }
  const star = STAR_AT[state.star];
  d.style.borderStyle = "solid";
  d.className = "detail tone-"+STAR_TONE[star];
  const dn = state.star==="C" ? I18N[state.lang].ds.C : I18N[state.lang].dirs[state.star];
  d.innerHTML = '<b>'+dn+' · '+t("s"+star+"_n")+'</b>'+t("s"+star+"_t");
}

function renderAll(){
  renderResult();
  renderDobNote();
  renderExtras();
  renderMap();
}

/* ============================================================
   EVENTS
   ============================================================ */
function init(){
  // language menu
  const langSel = $("lang");
  Object.keys(I18N).forEach(k => {
    const o = document.createElement("option");
    o.value = k; o.textContent = I18N[k].langName; langSel.appendChild(o);
  });
  let saved = null;
  try { saved = localStorage.getItem("guide2027.lang"); } catch(e){}
  const nav = (navigator.language || "en").toLowerCase();
  const pick = (nav.startsWith("id")||nav.startsWith("in")) ? "id" : nav.startsWith("ja") ? "ja" : nav.startsWith("zh") ? "zh" : "en";
  // a link like ...?lang=id opens in that language (used for the Indonesian Facebook post)
  let qlang = null;
  try { qlang = (new URLSearchParams(location.search).get("lang") || "").toLowerCase(); } catch(e){}
  state.lang = (qlang && I18N[qlang]) ? qlang : ((saved && I18N[saved]) ? saved : pick);
  langSel.value = state.lang;
  langSel.addEventListener("change", () => {
    state.lang = langSel.value;
    try { localStorage.setItem("guide2027.lang", state.lang); } catch(e){}
    applyStatic(); paintThemeBtn(); renderAll();
  });

  $("year").addEventListener("change", e => {
    const v = e.target.value ? parseInt(e.target.value,10) : null;
    state.year = v;
    if (state.dob && (!v || parseInt(state.dob.slice(0,4),10) !== v)){ state.dob = ""; $("dob").value = ""; }
    renderAll();
  });
  $("dob").addEventListener("change", e => {
    const v = e.target.value;
    if (v && /^\d{4}-\d{2}-\d{2}$/.test(v)){
      const y = parseInt(v.slice(0,4),10);
      if (y >= 1930 && y <= 2026){
        state.dob = v; state.year = y; $("year").value = String(y);
      }
    } else { state.dob = ""; }
    renderAll();
  });
  $("genderChips").addEventListener("click", e => {
    const b = e.target.closest("button[data-g]"); if (!b) return;
    state.gender = (state.gender === b.dataset.g) ? null : b.dataset.g;
    document.querySelectorAll("#genderChips .chip").forEach(c => c.setAttribute("aria-pressed", c.dataset.g===state.gender ? "true":"false"));
    renderExtras(); renderMap();
  });
  $("focusChips").addEventListener("click", e => {
    const b = e.target.closest("button[data-f]"); if (!b) return;
    const f = b.dataset.f;
    if (state.focus.has(f)) state.focus.delete(f); else state.focus.add(f);
    b.setAttribute("aria-pressed", state.focus.has(f) ? "true":"false");
    renderExtras();
  });

  // default month = current month of the 2027 year if we are inside it
  const now = Date.now();
  for (let i=0;i<12;i++){ const r = monthRange(i); if (now >= r.start.getTime() && now <= r.end.getTime()+86399999){ state.month = i; break; } }

  // week-by-week: default to this week if we are already inside the Goat year
  const tdy = new Date(), tdMs = Date.UTC(tdy.getFullYear(), tdy.getMonth(), tdy.getDate());
  if (tdMs >= DAY_FIRST && tdMs <= DAY_LAST){ state.week = weekOf(tdMs); state.day = isoOf(tdMs); }
  else { state.week = 0; state.day = isoOf(DAY_FIRST); }
  const rerenderWeek = () => { const cy = effectiveYear(); if (cy) renderWeek(branchOf(cy)); };
  $("actChips").addEventListener("click", e => {
    const b = e.target.closest("button[data-a]"); if (!b) return;
    state.act = b.dataset.a;
    document.querySelectorAll("#actChips .chip").forEach(c => c.setAttribute("aria-pressed", c.dataset.a===state.act ? "true":"false"));
    rerenderWeek();
  });
  $("wkPrev").addEventListener("click", () => { state.week = Math.max(0, state.week-1); state.day = null; rerenderWeek(); });
  $("wkNext").addEventListener("click", () => { state.week = Math.min(NUM_WEEKS-1, state.week+1); state.day = null; rerenderWeek(); });

  // QR fallbacks
  document.querySelectorAll(".qr img").forEach(img => {
    img.addEventListener("error", () => {
      const ph = document.createElement("div"); ph.className = "ph"; ph.textContent = t("qr_soon");
      img.replaceWith(ph);
    });
  });

  // install button
  let deferred = null;
  window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferred = e; });
  const standalone = (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || window.navigator.standalone;
  if (standalone) $("installBtn").hidden = true;
  $("installBtn").addEventListener("click", async () => {
    if (deferred){ deferred.prompt(); try { await deferred.userChoice; } catch(e){} deferred = null; return; }
    const dlg = $("installDlg");
    if (dlg.showModal) dlg.showModal(); else alert(t("install_ios") + "\n\n" + t("install_android"));
  });
  $("installClose").addEventListener("click", () => $("installDlg").close());

  $("themeBtn").addEventListener("click", toggleTheme);
  window.addEventListener("hashchange", route);
  applyStatic();
  paintThemeBtn();
  renderAll();
  route();
}


/* ============================================================
   WEEK BY WEEK: day ratings
   Rules used: the 12 Day Officers (建除十二神), how the day branch relates
   to the user's sign, and the year-breaking day (an Ox day in a Goat year).
   ============================================================ */
const STEMS = ["甲","乙","丙","丁","戊","己","庚","辛","壬","癸"];
const BR_CHARS = ["子","丑","寅","卯","辰","巳","午","未","申","酉","戌","亥"];
const DAY_MS = 86400000;
const WEEK0 = Date.UTC(2027,1,1);          // Monday 1 Feb 2027
const DAY_FIRST = Date.UTC(2027,1,4);      // Li Chun 2027
const DAY_LAST  = Date.UTC(2028,1,3);      // day before Li Chun 2028
const NUM_WEEKS = 53;
const MONTH_START_MS = MONTH_STARTS.map(m => Date.UTC(m[0], m[1]-1, m[2]));
const ACT_KEYS = ["biz","love","move","health"];
// [business, love, travel & move, health]  2 = good, 1 = fair, 0 = avoid
const OFFICER = [
  [2,1,2,1], // 0 Jian 建
  [1,1,1,2], // 1 Chu 除
  [2,2,1,0], // 2 Man 满
  [1,1,1,1], // 3 Ping 平
  [2,2,0,0], // 4 Ding 定
  [1,1,0,1], // 5 Zhi 执
  [0,0,0,1], // 6 Po 破
  [0,1,0,1], // 7 Wei 危
  [2,2,2,1], // 8 Cheng 成
  [1,1,0,0], // 9 Shou 收
  [2,2,2,2], // 10 Kai 开
  [0,0,0,0]  // 11 Bi 闭
];
const LV_KEY = {"2":"lv_good","1":"lv_ok","0":"lv_avoid","-1":"lv_bad"};
const LV_TONE = {"2":"good","1":"steady","0":"care","-1":"bad"};
const LV_SYM = {"2":"✓","1":"–","0":"!","-1":"✕"};

const isoOf = ms => new Date(ms).toISOString().slice(0,10);
const msOfIso = iso => Date.parse(iso+"T00:00:00Z");
const weekOf = ms => Math.floor((ms - WEEK0) / (7*DAY_MS));

function dayInfo(ms){
  if (ms < DAY_FIRST || ms > DAY_LAST) return null;
  const n = Math.round((ms - Date.UTC(2000,0,1)) / DAY_MS);
  const idx = (((n + 54) % 60) + 60) % 60;
  const stem = idx % 10, branch = idx % 12;
  let mi = 0; for (let i=0;i<12;i++){ if (MONTH_START_MS[i] <= ms) mi = i; }
  const officer = (((branch - (2+mi)) % 12) + 12) % 12;
  return {stem, branch, officer};
}
function dayScores(a, info){
  const base = OFFICER[info.officer];
  const rel = relation(a, info.branch);
  const notes = [];
  let adj = 0, force = false;
  if (rel==="clash"){ force = true; notes.push("dn_clash"); }
  else if (rel==="six" || rel==="three"){ adj = 1; notes.push("dn_help"); }
  else if (rel==="punish" || rel==="harm"){ adj = -1; notes.push("dn_harm"); }
  else if (rel==="ben"){ notes.push("dn_ben"); }
  if (info.branch === 1){ force = true; notes.push("dn_sui"); }
  const scores = base.map(v => force ? -1 : Math.max(0, Math.min(2, v + adj)));
  return {scores, notes};
}
const fmtFull = d => new Intl.DateTimeFormat(I18N[state.lang].locale,{day:"numeric",month:"short",year:"numeric",timeZone:"UTC"}).format(d);
const fmtWdShort = d => new Intl.DateTimeFormat(I18N[state.lang].locale,{weekday:"short",timeZone:"UTC"}).format(d);
const fmtWdLong = d => new Intl.DateTimeFormat(I18N[state.lang].locale,{weekday:"long",timeZone:"UTC"}).format(d);

function renderWeek(a){
  const sec = $("weekSec"); sec.hidden = false;
  const ai = ACT_KEYS.indexOf(state.act);
  const wStart = WEEK0 + state.week*7*DAY_MS;
  $("wkLabel").textContent = fmtShort(new Date(wStart)) + " – " + fmtFull(new Date(wStart + 6*DAY_MS));
  $("wkPrev").disabled = state.week <= 0;
  $("wkNext").disabled = state.week >= NUM_WEEKS-1;
  $("actHint").textContent = t("a_"+state.act+"_d");

  // make sure the selected day sits inside this week and inside the Goat year
  const selMs = state.day ? msOfIso(state.day) : NaN;
  if (!(selMs >= wStart && selMs < wStart + 7*DAY_MS) || !dayInfo(selMs)){
    let pick = null;
    for (let i=0;i<7;i++){ if (dayInfo(wStart + i*DAY_MS)){ pick = wStart + i*DAY_MS; break; } }
    state.day = pick ? isoOf(pick) : null;
  }

  const grid = $("days"); grid.innerHTML = "";
  const best = [];
  for (let i=0;i<7;i++){
    const ms = wStart + i*DAY_MS, d = new Date(ms);
    const info = dayInfo(ms);
    const btn = document.createElement("button");
    btn.type = "button";
    if (!info){
      btn.className = "day"; btn.disabled = true;
      btn.setAttribute("aria-label", fmtWdLong(d)+" "+fmtShort(d)+": "+t("day_off"));
      btn.innerHTML = '<span class="wd">'+fmtWdShort(d)+'</span><span class="dd">'+d.getUTCDate()+'</span><span class="pl">·</span><span class="sy"> </span>';
      grid.appendChild(btn); continue;
    }
    const r = dayScores(a, info), sc = r.scores[ai];
    const pillar = STEMS[info.stem] + BR_CHARS[info.branch];
    btn.className = "day tone-"+LV_TONE[sc];
    btn.setAttribute("aria-pressed", state.day === isoOf(ms) ? "true" : "false");
    btn.setAttribute("aria-label", fmtWdLong(d)+" "+fmtShort(d)+", "+pillar+", "+t(LV_KEY[sc]));
    btn.innerHTML = '<span class="wd">'+fmtWdShort(d)+'</span><span class="dd">'+d.getUTCDate()+'</span><span class="pl cjk">'+pillar+'</span><span class="sy">'+LV_SYM[sc]+'</span>';
    btn.addEventListener("click", () => { state.day = isoOf(ms); renderWeek(a); $("days").children[i].focus(); });
    grid.appendChild(btn);
    if (sc === 2) best.push({txt: fmtWdShort(d)+" "+d.getUTCDate(), top: info.officer===8 || info.officer===10 || r.notes.indexOf("dn_help")>=0});
  }
  // if many days score well, show only the strongest (Success/Open days or days that favour your sign)
  let shown = best; const tops = best.filter(b => b.top);
  if (best.length > 3 && tops.length) shown = tops;
  $("bestDays").innerHTML = shown.length
    ? '<div class="row"><b>'+t("best_days")+':</b>'+shown.map(x=>'<span class="pill tone-good">✓ '+x.txt+'</span>').join("")+'</div>'
    : '<div class="note" style="margin:0">'+t("no_good")+'</div>';

  // detail for the selected day
  const dd = $("dayDetail");
  if (!state.day){ dd.innerHTML = '<span class="note">'+t("day_off")+'</span>'; return; }
  const ms = msOfIso(state.day), d = new Date(ms), info = dayInfo(ms), r = dayScores(a, info);
  const pillar = STEMS[info.stem] + BR_CHARS[info.branch];
  let h = '<b>'+fmtWdLong(d)+', '+fmtFull(d)+'</b>'+
          '<small><span class="cjk">'+pillar+'</span> · '+t("day_of",{animal:animalName(info.branch)})+'</small>'+
          '<p><b>'+t("officer_label")+': '+t("o"+info.officer+"_n")+'</b>'+t("o"+info.officer+"_t")+'</p>';
  if (r.notes.length) h += '<p>'+r.notes.map(n=>t(n)).join(" ")+'</p>';
  h += '<div class="catrows">';
  ACT_KEYS.forEach((k,idx) => {
    const sc = r.scores[idx];
    h += '<div class="catrow tone-'+LV_TONE[sc]+(k===state.act?' sel':'')+'"><span>'+LV_SYM[sc]+' '+t("a_"+k)+'</span><span>'+t(LV_KEY[sc])+'</span></div>';
  });
  h += '</div>';
  dd.innerHTML = h;
}
function jumpToMonth(i){
  const ms = MONTH_START_MS[i];
  state.week = Math.max(0, Math.min(NUM_WEEKS-1, weekOf(ms)));
  state.day = isoOf(ms);
}

/* ---------- theme (light by default, remembered on this device) ---------- */
function currentTheme(){ return document.documentElement.getAttribute("data-theme")==="dark" ? "dark" : "light"; }
function paintThemeBtn(){
  const dark = currentTheme()==="dark";
  $("themeIcon").textContent = dark ? "☀" : "☾";
  $("themeBtn").setAttribute("aria-label", t(dark ? "theme_to_light" : "theme_to_dark"));
  $("themeBtn").title = t(dark ? "theme_to_light" : "theme_to_dark");
  let m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute("content", dark ? "#121820" : "#b8282f");
}
function toggleTheme(){
  const next = currentTheme()==="dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  try { localStorage.setItem("guide2027.theme", next); } catch(e){}
  paintThemeBtn();
}

/* ---------- two pages: guide (#home) and support (#support) ---------- */
function route(){
  const sup = location.hash === "#support";
  $("pageMain").hidden = sup;
  $("pageSupport").hidden = !sup;
  window.scrollTo(0,0);
}

document.addEventListener("DOMContentLoaded", init);
</script>
